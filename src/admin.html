<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mochi · 认证管理</title><link rel="stylesheet" href="/admin.css"><script type="module" src="/admin.js"></script></head>
<body><main>
<header><div><p class="eyebrow">MOCHI</p><h1>认证管理</h1><p>管理 DeepSeek API key 与 OpenAI subscription。</p></div><button id="signin">使用 Entra 登录</button><button id="signout" hidden>退出管理会话</button></header>
<p id="message" role="status" aria-live="polite">仅允许登记的个人账号访问。</p>
<section id="providers" hidden>
<article><h2>DeepSeek</h2><p id="deepseek-status">正在读取状态…</p><form id="key-form"><label for="key">新的 API key</label><input id="key" type="password" required maxlength="8192" autocomplete="off" spellcheck="false"><div class="actions"><button type="submit">保存 / 更换 key</button><button type="button" id="deepseek-logout" class="secondary">移除认证</button></div></form><small>已保存的 key 不会回显。</small></article>
<article><h2>OpenAI subscription</h2><p id="openai-codex-status">正在读取状态…</p><div class="actions"><button id="openai-login">登录 / 重新授权</button><button id="openai-refresh" class="secondary">验证并刷新订阅认证</button><button id="openai-codex-logout" class="secondary">移除认证</button></div><div id="device" hidden><p>在 OpenAI 授权页面输入以下设备码：</p><strong id="device-code"></strong><p><a id="device-link" target="_blank" rel="noopener noreferrer" hidden>打开 OpenAI 授权页面</a></p><button id="cancel" class="secondary">取消授权</button></div></article>
<article><div class="actions"><h2>模型目录</h2><button id="refresh" class="secondary">刷新状态</button></div><p>目录来自固定 Pi SDK；账户实际可用性需调用验证。</p><ul id="models"></ul></article>
</section><footer>首期仅支持无工具对话。管理登录与模型 provider 认证相互独立。</footer>
</main></body></html>
